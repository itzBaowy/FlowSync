name: flowsync-production
x-app: &app
  env_file: ${FLOWSYNC_ENV_FILE:-.env.production}
  environment:
    NODE_ENV: production
    API_PORT: 4000
    TRUST_PROXY_HOPS: 1
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  init: true
  logging: &logging
    driver: json-file
    options: { max-size: '10m', max-file: '3' }
services:
  migrate:
    build: { context: ., target: migrator }
    image: ${FLOWSYNC_IMAGE_PREFIX:-flowsync}-migrator:${FLOWSYNC_RELEASE:-local}
    env_file: ${FLOWSYNC_ENV_FILE:-.env.production}
    environment: { NODE_ENV: production }
    restart: 'no'
    logging: *logging
  api:
    <<: *app
    build: { context: ., target: api }
    image: ${FLOWSYNC_IMAGE_PREFIX:-flowsync}-api:${FLOWSYNC_RELEASE:-local}
    expose: ['4000']
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://${FLOWSYNC_DOMAIN:?Set the public domain}/api
    image: ${FLOWSYNC_IMAGE_PREFIX:-flowsync}-web:${FLOWSYNC_RELEASE:-local}
    environment: { NODE_ENV: production, HOSTNAME: '0.0.0.0', PORT: '3000' }
    expose: ['3000']
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777', '/app/apps/web/.next/cache:size=128m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    init: true
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *logging
  worker:
    <<: *app
    image: ${FLOWSYNC_IMAGE_PREFIX:-flowsync}-api:${FLOWSYNC_RELEASE:-local}
    command: ['node', 'dist/worker.js']
    depends_on:
      api: { condition: service_healthy }
    stop_grace_period: 60s
    healthcheck:
      test: ['CMD', 'node', 'dist/worker-health.js']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
  proxy:
    image: caddy:2.11.7-alpine
    environment:
      FLOWSYNC_DOMAIN: ${FLOWSYNC_DOMAIN:?Set the public domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set a certificate contact email}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    logging: *logging
volumes:
  caddy_data:
  caddy_config:
